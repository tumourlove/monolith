# Publishes wiki/ to the GitHub wiki on every push to master that touches it.
# Edit the pages in wiki/ here, not in the wiki tab: edits made on the wiki
# itself get overwritten the next time this runs.
name: Publish wiki

on:
  push:
    branches: [master]
    paths:
      - wiki/**
      - .github/workflows/publish-wiki.yml
  workflow_dispatch:

concurrency:
  group: publish-wiki
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Refuse to publish an empty or half-missing wiki: the sync below
      # mirrors wiki/ exactly, so a missing folder would wipe every page.
      - name: Check wiki/ has its pages
        run: |
          test -f wiki/Home.md || { echo "wiki/Home.md missing, refusing to publish"; exit 1; }
          n=$(find wiki -maxdepth 1 -name '*.md' | wc -l)
          echo "$n pages"
          [ "$n" -ge 10 ] || { echo "Only $n pages in wiki/, refusing to publish"; exit 1; }
      - uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: wiki/
          # Pages are already in wiki form (Home.md, [[links]]), so publish them as-is.
          preprocess: false
          disable-empty-commits: true
